[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Scanning stays on, but two values legitimately appear in the build output and would
  # otherwise fail the build: the canonical URL, and the contact address, which is printed in
  # the footer and contact section. CONTACT_SECRET and EMAIL_PASS are deliberately NOT exempt —
  # if either ever reaches the client bundle the build should fail.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,EMAIL_USER"

# Headers for SEO
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    # 0 is current guidance — the legacy auditor caused vulnerabilities of its own.
    X-XSS-Protection = "0"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Without HSTS the first visit is still downgradeable despite the 301s below.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Cache control for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects for SEO and canonical URL consistency
# Handle exact root URLs first
[[redirects]]
  from = "http://dgomez.dev/"
  to = "https://dgomez.dev"
  status = 301
  force = true

[[redirects]]
  from = "http://www.dgomez.dev/"
  to = "https://dgomez.dev"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dgomez.dev/"
  to = "https://dgomez.dev"
  status = 301
  force = true

# Handle all other paths with splat
[[redirects]]
  from = "http://dgomez.dev/*"
  to = "https://dgomez.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.dgomez.dev/*"
  to = "https://dgomez.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dgomez.dev/*"
  to = "https://dgomez.dev/:splat"
  status = 301
  force = true
